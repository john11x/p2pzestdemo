name: CI and EC2 deploy

on:
  push:

permissions:
  contents: read

concurrency:
  group: zestp2p-production
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install frontend dependencies when needed
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(sha256sum package.json pnpm-lock.yaml | sha256sum | awk '{print $1}')"
          marker="node_modules/.ci-dependency-fingerprint"
          if [[ -x node_modules/.bin/eslint && -f "$marker" && "$(cat "$marker")" == "$fingerprint" ]]; then
            echo "Frontend dependencies already match the lockfile; skipping install."
          else
            pnpm install --frozen-lockfile --prefer-offline
            mkdir -p node_modules
            printf '%s\n' "$fingerprint" > "$marker"
          fi

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: pnpm build

      - name: Test and package backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -f springbackend/pom.xml package

      - name: Validate Docker Compose configuration
        env:
          APP_ENV_FILE: /dev/null
          IMAGE_TAG: validation
        run: docker compose -f compose.yaml config --quiet

      - name: Prepare Docker build contexts
        run: |
          set -euo pipefail
          mkdir -p docker/frontend/site docker/backend
          cp -a dist/. docker/frontend/site/
          cp springbackend/target/springbackend-0.0.1-SNAPSHOT.jar docker/backend/app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: docker/frontend
          push: true
          tags: ghcr.io/john11x/p2pzestdemo-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: docker/backend
          push: true
          tags: ghcr.io/john11x/p2pzestdemo-backend:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment prerequisites
        run: |
          set -euo pipefail
          command -v docker
          docker compose version
          docker info >/dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and recreate both services
        run: |
          set -euo pipefail
          export IMAGE_TAG="$GITHUB_SHA"
          docker compose -f compose.yaml pull
          if sudo systemctl is-active --quiet zestp2p.service; then
            sudo systemctl disable --now zestp2p.service
          fi
          docker compose -f compose.yaml up -d --force-recreate --remove-orphans
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-connrefused http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null