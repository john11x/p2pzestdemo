name: CI and EC2 deploy

on:
  push:

permissions:
  contents: read

concurrency:
  group: zestp2p-production
  cancel-in-progress: false

jobs:
  ci-and-deploy:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check preinstalled build tools
        run: |
          set -euo pipefail
          command -v node
          command -v pnpm
          command -v java
          command -v mvn
          node --version
          pnpm --version
          java -version
          mvn --version

      - name: Install frontend dependencies from EC2 cache
        run: pnpm install --offline --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: pnpm build

      - name: Test and package backend with frontend
        run: |
          set -euo pipefail
          mkdir -p springbackend/target/classes/static
          cp -a dist/. springbackend/target/classes/static/
          mvn -o -f springbackend/pom.xml package

      - name: Check deployment configuration
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          sudo test -s /etc/zestp2p/zestp2p.env || {
            echo "Create /etc/zestp2p/zestp2p.env on EC2 before deploying." >&2
            exit 1
          }
          test -s springbackend/target/springbackend-0.0.1-SNAPSHOT.jar

      - name: Deploy and restart Spring Boot
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          sudo install -d -o ubuntu -g ubuntu /opt/zestp2p
          sudo install -o ubuntu -g ubuntu -m 0644 \
            springbackend/target/springbackend-0.0.1-SNAPSHOT.jar \
            /opt/zestp2p/app.jar
          sudo install -m 0644 deploy/zestp2p.service \
            /etc/systemd/system/zestp2p.service
          sudo systemctl daemon-reload
          sudo systemctl enable zestp2p
          sudo systemctl restart zestp2p
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-connrefused http://127.0.0.1:8080/api/health