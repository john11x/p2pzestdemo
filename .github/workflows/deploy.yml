name: CI and EC2 deploy

on:
  push:

permissions:
  contents: read

concurrency:
  group: zestp2p-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: pnpm build

      - name: Test and package backend with frontend
        run: |
          set -euo pipefail
          mkdir -p springbackend/target/classes/static
          cp -a dist/. springbackend/target/classes/static/
          mvn --batch-mode --no-transfer-progress -f springbackend/pom.xml package

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: zestp2p-app
          path: springbackend/target/springbackend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: zestp2p-app
          path: springbackend/target

      - name: Check deployment prerequisites
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "Java 17 is missing. Install a Java 17 runtime on this EC2 host." >&2
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jre-headless
          fi
          command -v java
          java -version
          sudo test -s /etc/zestp2p/zestp2p.env || {
            echo "Create /etc/zestp2p/zestp2p.env on EC2 before deploying." >&2
            exit 1
          }
          test -s springbackend/target/springbackend-0.0.1-SNAPSHOT.jar

      - name: Deploy and restart Spring Boot
        run: |
          set -euo pipefail
          sudo install -d -o ubuntu -g ubuntu /opt/zestp2p
          sudo install -o ubuntu -g ubuntu -m 0644 \
            springbackend/target/springbackend-0.0.1-SNAPSHOT.jar \
            /opt/zestp2p/app.jar
          sudo install -m 0644 deploy/zestp2p.service \
            /etc/systemd/system/zestp2p.service
          sudo systemctl daemon-reload
          sudo systemctl enable zestp2p
          sudo systemctl restart zestp2p
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            --retry-connrefused http://127.0.0.1:8080/api/health