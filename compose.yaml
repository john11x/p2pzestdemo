name: zestp2p

services:
  frontend:
    image: ghcr.io/john11x/p2pzestdemo-frontend:${IMAGE_TAG:-latest}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app

  backend:
    image: ghcr.io/john11x/p2pzestdemo-backend:${IMAGE_TAG:-latest}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge